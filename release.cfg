[AUTOUPDATE]
# release.cfg - wird von der LoxBerry-Plugin-Verwaltung fuer automatische Updates gelesen (RELEASECFG in plugin.cfg).
# Erzeugt mit "bash build.sh release-cfg" NACH dem GitHub-Release; nie auf eine Version zeigen lassen, deren ZIP noch fehlt.

# Version des aktuellen Releases (muss neuer sein als die installierte Version)
VERSION=1.4.2

# Direkter Download des Plugin-ZIP (Release-Anhang)
ARCHIVEURL=https://github.com/ricten/Senec2Lox/releases/download/v1.4.2/senec2lox-1.4.2.zip

# Seite mit Hinweisen zu diesem Release
INFOURL=https://github.com/ricten/Senec2Lox/releases/tag/v1.4.2
